services:
  db:
    image: mongo:6
    container_name: todo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  api:
    build: ./backend
    container_name: todo_backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://db:27017/todolist
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    networks:
      - app_network

  web:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: todo_frontend
    user: "node"
    ports:
      - "8080:8080"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - api
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    networks:
      - app_network

  # Runs the real backend test suite (Jest + Supertest with mocked Mongoose
  # models). No MongoDB connection is required for this suite, so `tests`
  # intentionally does not depend on `db`.
  tests:
    build: ./backend
    container_name: todo_tests
    command: npm test
    environment:
      NODE_ENV: test
      JWT_SECRET: test-secret-not-for-production
    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
    driver: bridge
